19.644007, -43.873317], [-19.644235, -43.873325], [-19.644463, -43.873334], [-19.644691, -43.873342], [-19.638465, -43.874698], [-19.63824, -43.874806], [-19.638016, -43.874914], [-19.637791, -43.875022], [-19.637567, -43.87513], [-19.637608, -43.874453], [-19.637823, -43.874364], [-19.638038, -43.874274], [-19.638252, -43.874185], [-19.638252, -43.874185], [-19.638541, -43.874046], [-19.63883, -43.873908]]}, {"rua": "Rua Vespasiano", "bairro": "Joá", "dias": 1, "relatos": 1, "detalhes": [{"data": "2026-11-08", "tipo": "falta", "duracao": "", "fonte": "whatsapp-gtj"}], "segmentos": [[[-19.6424055, -43.8720189], [-19.6424158, -43.8716817], [-19.6424262, -43.8713431], [-19.6424452, -43.8706552], [-19.6424614, -43.8699903]]], "calor": [[-19.642405, -43.872019], [-19.642416, -43.871682], [-19.642416, -43.871682], [-19.642426, -43.871343], [-19.642426, -43.871343], [-19.642436, -43.870999], [-19.642445, -43.870655], [-19.642445, -43.870655], [-19.642453, -43.870323], [-19.642461, -43.86999]]}]}, "semRua": {"energia": 8, "agua": 7}, "periodo": ["2026-08-09", "2026-11-11"], "gerado": "11/11/2026", "fonteMapa": "OpenStreetMap via Overpass API, 07/11/2026 (ODbL)"};
const CORES = { energia: { cor: '#c62828', grad: {0.2: '#ffe0b2', 0.5: '#ff7043', 1: '#b71c1c'}, rotulo: 'Energia (CEMIG)' },
                agua:    { cor: '#1565c0', grad: {0.2: '#bbdefb', 0.5: '#42a5f5', 1: '#0d47a1'}, rotulo: 'Água (COPASA)' } };

const mapa = L.map('mapa', { zoomControl: true });
const atribOSM = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
const bases = {
  'Mapa claro (CARTO)': L.tileLayer('https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_547h_1_e9139a149216b270d50b1724', {
    maxZoom: 20, attribution: atribOSM + ' &copy; <a href="https://carto.com/attributions">CARTO</a>' }),
  'Ruas (Esri)': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, attribution: 'Mapa &copy; Esri, HERE, Garmin, OpenStreetMap contributors' }),
  'Satélite (Esri)': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, attribution: 'Imagens &copy; Esri, Maxar, Earthstar Geographics' }),
  'OpenStreetMap': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: atribOSM }),
};
bases['Mapa claro (CARTO)'].addTo(mapa);

// Limites dos bairros
const limites = L.layerGroup();
for (const [nome, pts] of Object.entries(D.limites)) {
  L.polygon(pts, { color: '#555', weight: 2, dashArray: '6 4', fill: false }).bindTooltip(nome, { permanent: true, direction: 'center', className: 'rotulo-bairro' }).addTo(limites);
}
limites.addTo(mapa);

// Todas as ruas (fundo discreto, para referência)
const fundo = L.layerGroup();
for (const r of D.ruas) {
  for (const seg of r.segmentos) L.polyline(seg, { color: '#999', weight: 1, opacity: .5 }).bindTooltip(r.rua).addTo(fundo);
}

function fmt(d) { const [a, m, dia] = d.split('-'); return `${dia}/${m}/${a}`; }
function popup(item, servico) {
  const lis = item.detalhes.map(x => `<li>${fmt(x.data)} – ${x.tipo}${x.duracao ? ' (' + x.duracao + ')' : ''}</li>`).join('');
  return `<div class="popup"><b style="color:${CORES[servico].cor}">${item.rua}</b><br>
    ${CORES[servico].rotulo}: ${item.dias} dia(s) com problema, ${item.relatos} relato(s)<ul>${lis}</ul></div>`;
}

const camadas = {};
const bounds = [];
for (const [servico, itens] of Object.entries(D.camadas)) {
  const grupo = L.layerGroup();
  const max = Math.max(1, ...itens.map(i => i.dias));
  const pontos = [];
  for (const item of itens) {
    const peso = item.dias / max;
    for (const p of item.calor) pontos.push([p[0], p[1], peso]);
    for (const seg of item.segmentos) {
      L.polyline(seg, { color: CORES[servico].cor, weight: 2 + 1.5 * item.dias, opacity: .9 })
        .bindPopup(popup(item, servico)).addTo(grupo);
      bounds.push(...seg);
    }
  }
  L.heatLayer(pontos, { radius: 16, blur: 14, max: 1.6, minOpacity: .2, gradient: CORES[servico].grad }).addTo(grupo);
  camadas[servico] = grupo;
  grupo.addTo(mapa);
}

L.control.layers(bases, {
  '<span style="color:#c62828">■</span> Energia (vermelho)': camadas.energia,
  '<span style="color:#1565c0">■</span> Água (azul)': camadas.agua,
  'Limites dos bairros': limites,
  'Todas as ruas': fundo,
}, { collapsed: window.matchMedia('(max-width: 700px)').matches }).addTo(mapa);

if (bounds.length) mapa.fitBounds(L.latLngBounds(bounds).pad(0.25)); else mapa.setView([-19.642, -43.877], 15);

// Painel com ranking
const painel = L.control({ position: 'bottomleft' });
painel.onAdd = function () {
  const div = L.DomUtil.create('div', 'painel');
  let html = `<button class="fechar" title="Fechar" onclick="this.parentElement.classList.remove('aberto')">&times;</button><h4>Ruas com mais dias de falta</h4><div style="font-size:11px;color:#666;margin-bottom:6px">Quanto mais forte a cor no mapa, mais vezes faltou.</div>`;
  for (const servico of ['energia', 'agua']) {
    const itens = D.camadas[servico];
    html += `<h5 style="color:${CORES[servico].cor}">${CORES[servico].rotulo}</h5><div class="grad ${servico}"></div><div class="leg"><span>menos</span><span>mais</span></div><table>`;
    for (const i of itens) html += `<tr><td>${i.rua}</td><td class="n">${i.dias} dia(s) · ${i.relatos} relato(s)</td></tr>`;
    html += `<tr><td><i>Rua não informada</i></td><td class="n">${D.semRua[servico]} relato(s)</td></tr></table>`;
  }
  html += `<div class="rodape">Período: ${fmt(D.periodo[0])} a ${fmt(D.periodo[1])}. Gerado em ${D.gerado}.<br>
    A cor mostra quantos dias diferentes cada rua teve relato de falta. Clique na rua para ver as datas.<br>Mapa: ${D.fonteMapa}.</div>`;
  div.innerHTML = html;
  L.DomEvent.disableScrollPropagation(div);
  return div;
};
painel.addTo(mapa);

// No celular: painel recolhido, botão para abrir, controle de camadas fechado
const celular = window.matchMedia('(max-width: 700px)').matches;
if (celular) {
  const btn = L.control({ position: 'bottomleft' });
  btn.onAdd = function () {
    const d = L.DomUtil.create('div');
    d.innerHTML = '<button class="btn-painel">Ver ranking das ruas</button>';
    d.onclick = () => document.querySelector('.painel').classList.toggle('aberto');
    L.DomEvent.disableClickPropagation(d);
    return d;
  };
  btn.addTo(mapa);
  document.querySelectorAll('.leaflet-control-layers').forEach(c => c.classList.remove('leaflet-control-layers-expanded'));
}
